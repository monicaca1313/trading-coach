<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>盤中即時教練</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background:#12151C; color:#EDEEF2;

    display:flex; flex-direction:column;

  header { padding:20px 20px 14px; border-bottom:1px solid #232838; }

    font-family:inherit; border-bottom:2px solid transparent; }
  #tabs button.active { color:#F0B429; border-bottom-color:#F0B429; }
  .page { display:none; flex:1; min-height:0; flex-direction:column; }
  .page.active { display:flex; }

    color:#EDEEF2; font-size:14px; resize:vertical; min-height:64px; font-family:inherit; }

    font-weight:600; color:#12151C; font-size:13px; }

  .rule-item .rule-text { font-size:13px; margin-top:4px; line-height:1.5; }
  .rule-item .rule-del { margin-top:6px; background:none; border:none; color:#E5484D; font-size:11px; padding:0; }
  #rulesEmpty { color:#8B92A5; font-size:13px; text-align:center; margin-top:20px; }
  #scriptPage { padding:16px 20px; overflow-y:auto; }
  #scriptPage p.tip { font-size:12px; color:#8B92A5; margin:0 0 12px; line-height:1.6; }
  .field-label { font-size:12px; color:#8B92A5; margin:14px 0 6px; }

    padding:10px 10px; color:#EDEEF2; font-size:13px; font-family:inherit; }
  .point-row input.label { flex:1; background:#1B2029; border:none; border-radius:10px;
    padding:10px 12px; color:#EDEEF2; font-size:13px; font-family:inherit; }
  .point-row button.del { background:none; border:none; color:#E5484D; font-size:18px; padding:0 4px; }
  #addPointBtn { margin:6px 0 16px; background:#1B2029; border:1px dashed #8B92A5; border-radius:10px;
    padding:10px; width:100%; color:#8B92A5; font-size:13px; }
  #genScriptBtn { width:100%; background:#F0B429; border:none; border-radius:12px; padding:12px;
    font-weight:600; color:#12151C; font-size:14px; margin-bottom:16px; }
  #scriptOutput { background:#1B2029; border-radius:12px; padding:14px; font-size:13px; line-height:1.8;

<body>
  <header>
    <div class="eyebrow">Live Coach</div>
    <h1>盤中即時教練</h1>
  </header>

  <div id="keySetup" style="display:none;">
    第一次使用，先貼上你的 Groq API key（只會存在這台裝置的瀏覽器裡）：
    <input id="apiKeyInput" type="password" placeholder="gsk_..." />
  </div>

  <div id="tabs">
    <button id="tabCoachBtn" class="active">教練</button>
    <button id="tabRulesBtn">新增規則</button>
    <button id="tabScriptBtn">開盤劇本</button>
    <button id="tabReviewBtn">每日複盤</button>
  </div>

  <div id="coachPage" class="page active">
    <div id="log">
      <div class="empty">按下麥克風，直接講現在的盤勢或你的部位，教練馬上回你該怎麼做。</div>
    </div>
    <div id="thinking" style="display:none;">教練思考中…</div>

    <footer>
      <button id="micBtn"><svg viewBox="0 0 24 24" fill="#12151C"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3z"/><path d="M19 11a1 1 0 00-2 0 5 5 0 01-10 0 1 1 0 00-2 0 7 7 0 006 6.93V20H9a1 1 0 000 2h6a1 1 0 000-2h-2v-2.07A7 7 0 0019 11z"/></svg></button>
      <div id="hint">按一下開始講，再按一下結束</div>
      <div id="textRow">
        <input id="textInput" placeholder="語音讀錯字可以直接打字" />
        <button id="sendBtn">送出</button>
      </div>
    </footer>
  </div>

  <div id="rulesPage" class="page">
    <p class="tip">把你新驗證過、覺得有效的交易方法記下來，教練之後會把這些一起納入判斷。</p>
    <textarea id="newRuleInput" placeholder="例如：60K拉回測到大量位置，收上就可以接"></textarea>
    <button id="saveRuleBtn">儲存這條規則</button>
    <div id="customRulesList"></div>
    <div id="rulesEmpty" style="display:none;">目前還沒有新增任何規則</div>
  </div>

  <div id="scriptPage" class="page">
    <p class="tip">開盤前把今天的收盤價跟關鍵點位輸入，按產生，會列出往上開/往下開分別會先碰到哪裡。</p>
    <div class="field-label">今日收盤價（基準）</div>
    <input id="closeInput" type="number" inputmode="decimal" placeholder="例如：45090" />

    <div class="field-label">點位清單（價位＋說明，例如「今日最高（當日高點）」）</div>
    <div id="pointsList"></div>
    <button id="addPointBtn">＋ 新增一個點位</button>

    <button id="genScriptBtn">產生開盤劇本</button>
    <div id="scriptOutput"></div>
    <button id="copyScriptBtn">複製劇本文字</button>
  </div>

  <div id="reviewPage" class="page">
    <p class="tip">收盤後寫今天的複盤：路徑跟劇本一不一樣、有沒有照規則走、哪裡可以更好。</p>
    <input id="reviewDate" type="date" />
    <textarea id="newReviewInput" placeholder="例如：今天照劇本走，往上開站上缺口下緣就上多，滿足點到有跑掉，但第二腳等太久錯過"></textarea>
    <button id="saveReviewBtn">儲存今天的複盤</button>
    <div id="reviewList"></div>
    <div id="reviewEmpty" style="display:none;">目前還沒有複盤紀錄</div>
  </div>

<script>
const STORAGE_KEY = "trading_coach_api_key";
let apiKey = localStorage.getItem(STORAGE_KEY) || "";
const keySetup = document.getElementById("keySetup");
const apiKeyInput = document.getElementById("apiKeyInput");
if (!apiKey) {
  keySetup.style.display = "block";
} else {
  apiKeyInput.value = apiKey;
}
apiKeyInput.addEventListener("change", () => {
  apiKey = apiKeyInput.value.trim();
  localStorage.setItem(STORAGE_KEY, apiKey);
});

function buildRulesText(groups) {
  return Object.entries(groups).map(([category, items]) => {
    const lines = items.map(r => {
      if (r.condition && r.action) return `- ${r.condition} → ${r.action}`;
      if (r.condition && r.detail) return `- ${r.condition}：${r.detail}`;
      if (r.detail && r.value) return `- ${r.detail}：${r.value}`;
      if (r.principle) return `- ${r.principle}`;
      if (r.detail && r.note) return `- ${r.detail}（${r.note}）`;
      if (r.detail) return `- ${r.detail}`;
      return null;
    }).filter(Boolean).join("\n");
    return `【${category}】\n${lines}`;
  }).join("\n\n");
}

function buildNotesText(groups) {
  return Object.entries(groups).map(([theme, notes]) => {
    return `【${theme}】\n` + notes.map(n => `- ${n}`).join("\n");
  }).join("\n\n");
}

const logEl = document.getElementById("log");
const thinkingEl = document.getElementById("thinking");
let history = [];

function render(role, text, time) {
  const empty = logEl.querySelector(".empty");
  if (empty) empty.remove();
  const b = document.createElement("div");
  b.className = "bubble " + (role === "you" ? "you" : "coach");
  if (role === "you") {
    b.innerHTML = `<div>${text}</div><div class="time mono">${time}</div>`;
  } else {
    b.innerHTML = `<div class="time mono">COACH · ${time}</div><div>${text}</div>`;
  }
  logEl.appendChild(b);
  logEl.scrollTop = logEl.scrollHeight;
}

function nowStr() {
  return new Date().toLocaleTimeString("zh-TW", { hour12: false });
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW";
  u.rate = 1.05;
  window.speechSynthesis.speak(u);
}

async function sendToCoach(text) {
  if (!text) return;
  if (!apiKey) {
    keySetup.style.display = "block";
    return;
  }
  const time = nowStr();
  render("you", text, time);
  history.push({ role: "user", content: text });
  thinkingEl.style.display = "block";
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        max_tokens: 1000,
        messages: [{ role: "system", content: buildSystemPrompt() }, ...history.slice(-10)]
      })
    });
    const data = await res.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message.content)
      || (data.error ? "錯誤：" + data.error.message : "沒有收到回應，再說一次看看");
    history.push({ role: "assistant", content: reply });
    render("coach", reply, nowStr());
  } catch (e) {
    render("coach", "連線失敗，再說一次。", nowStr());
  } finally {
    thinkingEl.style.display = "none";
  }
}

// Speech recognition setup
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("micBtn");
const hint = document.getElementById("hint");
const textRow = document.getElementById("textRow");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

if (!SR) {
  micBtn.style.display = "none";
  hint.style.display = "none";
  textRow.style.display = "flex";
} else {
  let listening = false;
  let transcript = "";
  const rec = new SR();
  rec.lang = "zh-TW";
  rec.continuous = false;
  rec.interimResults = true;
  rec.onresult = (e) => {
    transcript = "";
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    hint.textContent = "按一下開始講，再按一下結束";
    if (transcript.trim()) {
      textInput.value = transcript.trim();
      textInput.focus();
    }
    transcript = "";
  };
  rec.onerror = () => {
    listening = false;
    micBtn.classList.remove("listening");
    hint.textContent = "按一下開始講，再按一下結束";
  };
  micBtn.addEventListener("click", () => {
    if (listening) {
      rec.stop();
    } else {
      transcript = "";
      listening = true;
      micBtn.classList.add("listening");
      hint.textContent = "說完再按一次結束";
      try { rec.start(); } catch (e) { listening = false; micBtn.classList.remove("listening"); }
    }
  });
}

sendBtn.addEventListener("click", () => {
  const t = textInput.value.trim();
  textInput.value = "";
  sendToCoach(t);
});
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendBtn.click();
});

  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
reviewDate.value = todayStr();

function loadReviews() {
  try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveReviews(list) { localStorage.setItem(REVIEW_KEY, JSON.stringify(list)); }

function renderReviews() {
  const list = loadReviews();
  reviewList.innerHTML = "";
  reviewEmpty.style.display = list.length ? "none" : "block";
  list.slice().reverse().forEach((r) => {
    const div = document.createElement("div");
    div.className = "review-item";
    div.innerHTML = `<div class="review-date">${r.date}</div><div class="review-text"></div>`;
    div.querySelector(".review-text").textContent = r.text;
    const del = document.createElement("button");
    del.className = "review-del";
    del.textContent = "刪除";
    del.addEventListener("click", () => {
      const cur = loadReviews().filter((x) => x.id !== r.id);
      saveReviews(cur);
      renderReviews();
    });
    div.appendChild(del);
    reviewList.appendChild(div);
  });
}

saveReviewBtn.addEventListener("click", () => {
  const text = newReviewInput.value.trim();
  if (!text) return;
  const list = loadReviews();
  list.push({ id: Date.now(), date: reviewDate.value || todayStr(), text });
  saveReviews(list);
  newReviewInput.value = "";
  renderReviews();
});

renderReviews();
</script>
</body>
</html>
