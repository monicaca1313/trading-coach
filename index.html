<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>盤中即時教練</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background:#12151C; color:#EDEEF2;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    display:flex; flex-direction:column;
  }
  .mono { font-family: 'SF Mono', ui-monospace, monospace; }
  header { padding:20px 20px 14px; border-bottom:1px solid #232838; }
  header .eyebrow { font-size:11px; letter-spacing:.15em; color:#F0B429; text-transform:uppercase; }
  header h1 { font-size:18px; margin:2px 0 0; font-weight:600; }
  #tabs { display:flex; gap:0; padding:0 20px; border-bottom:1px solid #232838; }
  #tabs button { flex:1; background:none; border:none; color:#8B92A5; font-size:13px; padding:12px 0;
    font-family:inherit; border-bottom:2px solid transparent; }
  #tabs button.active { color:#F0B429; border-bottom-color:#F0B429; }
  .page { display:none; flex:1; min-height:0; flex-direction:column; }
  .page.active { display:flex; }
  #rulesPage { padding:16px 20px; overflow-y:auto; }
  #rulesPage p.tip { font-size:12px; color:#8B92A5; margin:0 0 12px; line-height:1.6; }
  #newRuleInput { width:100%; background:#1B2029; border:none; border-radius:12px; padding:12px 14px;
    color:#EDEEF2; font-size:14px; resize:vertical; min-height:64px; font-family:inherit; }
  #saveRuleBtn { margin-top:8px; background:#F0B429; border:none; border-radius:10px; padding:10px 16px;
    font-weight:600; color:#12151C; font-size:13px; }
  #customRulesList { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .rule-item { background:#1B2029; border-left:2px solid #1FA97D; border-radius:10px; padding:10px 12px; }
  .rule-item .rule-time { font-size:10px; color:#8B92A5; }
  .rule-item .rule-text { font-size:13px; margin-top:4px; line-height:1.5; }
  .rule-item .rule-del { margin-top:6px; background:none; border:none; color:#E5484D; font-size:11px; padding:0; }
  #rulesEmpty { color:#8B92A5; font-size:13px; text-align:center; margin-top:20px; }
  #log { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
  .empty { color:#8B92A5; font-size:14px; text-align:center; margin-top:40px; line-height:1.7; padding:0 24px; }
  .bubble { max-width:82%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; }
  .you { align-self:flex-end; background:#1B2029; border-top-right-radius:4px; }
  .coach { align-self:flex-start; background:#1B2029; border-left:2px solid #F0B429; border-top-left-radius:4px; }
  .time { font-size:10px; color:#8B92A5; margin-top:4px; }
  .coach .time { color:#F0B429; margin:0 0 4px; text-transform:uppercase; }
  #thinking { color:#8B92A5; font-size:12px; padding-left:4px; }
  footer { padding:12px 20px 28px; border-top:1px solid #232838; display:flex; flex-direction:column; align-items:center; gap:8px; }
  #micBtn {
    width:64px; height:64px; border-radius:50%; border:none; background:#F0B429;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #micBtn.listening { background:#E5484D; animation: pulse 1.4s infinite; }
  #micBtn svg { width:26px; height:26px; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(240,180,41,.45);} 70%{box-shadow:0 0 0 22px rgba(240,180,41,0);} 100%{box-shadow:0 0 0 0 rgba(240,180,41,0);} }
  #hint { font-size:11px; color:#8B92A5; }
  #textRow { display:flex; width:100%; gap:8px; margin-top:10px; }
  #textInput { flex:1; background:#1B2029; border:none; border-radius:12px; padding:12px 14px; color:#EDEEF2; font-size:14px; }
  #sendBtn { background:#F0B429; border:none; border-radius:12px; padding:0 16px; font-weight:600; color:#12151C; }
  #keySetup { padding:16px 20px; font-size:12px; color:#8B92A5; }
  #keySetup input { width:100%; background:#1B2029; border:none; border-radius:10px; padding:10px 12px; color:#EDEEF2; margin-top:6px; }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Live Coach</div>
    <h1>盤中即時教練</h1>
  </header>

  <div id="keySetup" style="display:none;">
    第一次使用，先貼上你的 Groq API key（只會存在這台裝置的瀏覽器裡）：
    <input id="apiKeyInput" type="password" placeholder="gsk_..." />
  </div>

  <div id="tabs">
    <button id="tabCoachBtn" class="active">教練</button>
    <button id="tabRulesBtn">新增規則</button>
  </div>

  <div id="coachPage" class="page active">
    <div id="log">
      <div class="empty">按下麥克風，直接講現在的盤勢或你的部位，教練馬上回你該怎麼做。</div>
    </div>
    <div id="thinking" style="display:none;">教練思考中…</div>

    <footer>
      <button id="micBtn"><svg viewBox="0 0 24 24" fill="#12151C"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3z"/><path d="M19 11a1 1 0 00-2 0 5 5 0 01-10 0 1 1 0 00-2 0 7 7 0 006 6.93V20H9a1 1 0 000 2h6a1 1 0 000-2h-2v-2.07A7 7 0 0019 11z"/></svg></button>
      <div id="hint">按一下開始講，再按一下結束</div>
      <div id="textRow">
        <input id="textInput" placeholder="語音讀錯字可以直接打字" />
        <button id="sendBtn">送出</button>
      </div>
    </footer>
  </div>

  <div id="rulesPage" class="page">
    <p class="tip">把你新驗證過、覺得有效的交易方法記下來，教練之後會把這些一起納入判斷。</p>
    <textarea id="newRuleInput" placeholder="例如：60K拉回測到呂布位置，量縮站穩就可以接"></textarea>
    <button id="saveRuleBtn">儲存這條規則</button>
    <div id="customRulesList"></div>
    <div id="rulesEmpty" style="display:none;">目前還沒有新增任何規則</div>
  </div>

<script>
const STORAGE_KEY = "trading_coach_api_key";
let apiKey = localStorage.getItem(STORAGE_KEY) || "";
const keySetup = document.getElementById("keySetup");
const apiKeyInput = document.getElementById("apiKeyInput");
if (!apiKey) {
  keySetup.style.display = "block";
} else {
  apiKeyInput.value = apiKey;
}
apiKeyInput.addEventListener("change", () => {
  apiKey = apiKeyInput.value.trim();
  localStorage.setItem(STORAGE_KEY, apiKey);
});

const RULES = "開盤洗前高、回測大量、缺口W、打腳、空襲測開盤價、30K頂+呂布、收上呂布2號、測20MA、多方呂布、兩腳、開盤測黑頂、出現空方成本後站上又跌破、測開盤價、回測空方成本出現呂布、回測前方呂布位置、破底翻、站上小流看大流、奇襲力道會跑完、日K打腳、注意下引線、回測5K第一根高點、規劃30K會回測哪裡、確定擋再進、小流不過看大流、這兩次的地方要跑、日K多勢大小流未破多訊、突破回測出量處、口差不對不要接、空完出量就要跑、PM滿足跑、靠近滿足點的缺口不要接、第二腳進場等呂布位置回測接、不要找逆勢訊號、口差-3000以上不動作、日頸測兩次、第二筆要接要等尖尖的、沒有人知道高點在哪只有擋了才能估、結算日短做、開盤大跌是給留倉的人停利用的、頂多再打第二隻腳、打腳完盤就上、大紅大黑頂很多人在用的地方、均線-城、收上大流看小流、大流下有大紅要等、有很多人在顧反手會被巴、預估日盤沒跑完夜盤會跑完、斷勢反手、不要取消停損、大跌後不要追空看5K兩腳、5K過頸翻亞當、過高不破高、滿足點要走、看型態、看錯即砍、翻亞當要等5K收定、破低不過低、亞當不能當進場點、5K尖尖的才能下、站在後面不要急、紅下尖綠上尖、尖尖後面那根、好球整理完出去、壞球滿足區撞牆、最好的辦法等線到再做、策略隨球權與勢改變、Vic 18.9選多做、懷疑就不要下、60K亞當要等整理再上、用1K畫看5K型態、等60K邊邊等5K破底翻、要設停損左邊要有人擋、回測關鍵點位要有呂布、高處下來要整理過才C尖尖的、回測高點要等尖尖的、突破空防回測C、PM等60K邊邊5K W、奇襲防守點上有尖尖、回撤奇襲防守點要等整理尖尖的配點位、要等滿足點才進、看到上尖P要等回測、高點下來C要等整理尖尖的、球權看有沒有延續、等尖尖下不去才C、等60K頸線、高點不過P、60K邊邊可等兩滿、1K 5K亞當要等尖尖的等一條線、日K突破前高可翻亞當、多襲回測黑頂尖尖C、回測黑頂守黑頂等60K邊邊比較好、收上多方防守點有尖尖C、站上轉勢防守點要等回測、向下整理尖尖C、突破回測前高C、Vix 23大跌可賭八滿50倍、打腳要先跑";

const CUSTOM_RULES_KEY = "trading_coach_custom_rules";

function loadCustomRules() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_RULES_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveCustomRules(list) {
  localStorage.setItem(CUSTOM_RULES_KEY, JSON.stringify(list));
}

function buildSystemPrompt() {
  const custom = loadCustomRules();
  const customText = custom.length
    ? "\n\n她後來自己新增、驗證過的成功交易方法（優先參考，這些是她實戰確認過的）：\n" + custom.map(r => r.text).join("、")
    : "";
  return "你是使用者本人的台指期私人交易教練，完全按照她自己的多時間週期價格行為系統來判斷，不要給教科書式的通用技術分析建議。她會用口語、片段的方式描述目前盤勢或部位，你要用她自己的術語和規則去判讀。\n\n她的規則庫：\n" + RULES + customText + "\n\n你的任務：1) 用她的術語判讀她描述的狀況對應到規則庫裡的哪一條或哪幾條 2) 給出具體、可立即執行的下一步 3) 語氣像教練在場邊喊話。\n\n嚴格的講話規則（違反任何一條都算失敗）：\n- 絕對不要把規則名稱用括號標註出來，例如「（對應『XX』）」「（XX規則）」這種寫法禁止，你心裡知道對應哪條就好，不要講給她聽你是怎麼查表的\n- 一句只講一件事，講完就換下一句。不要用分號、頓號把好幾件事串成一個長句，那是報告的寫法不是講話的寫法\n- 不要用成語、文言字眼（例如「切莫」「務必」「當下」這類），要用她平常真的會用的口語，例如「先別」「等一下」「先不要」\n- 總長度2-3句話，每句都短，像真人在旁邊看盤喊一句、停一下、再喊一句，不是一次講完的完整報告\n- 可以直接用她的術語（呂布、亞當、尖尖、球權、滿足點等）回她，不用翻譯成白話\n\n你不是投資顧問，但你是她本人交易系統的化身，不要加免責聲明。\n\n範例（她說「收上空襲防守點，口差還在-3200」）：\n壞範例（禁止這樣）：收上空襲防守點，先等尖尖C現形再下單（對應「收上空襲防守點有尖尖C」）；口差若仍在-3000以上，先別動；切莫逆勢追。\n好範例（照這樣寫）：收上空襲防守點了。先別急，等尖尖出來。口差還在-3000以上，先不要動。";
}

const logEl = document.getElementById("log");
const thinkingEl = document.getElementById("thinking");
let history = [];

function render(role, text, time) {
  const empty = logEl.querySelector(".empty");
  if (empty) empty.remove();
  const b = document.createElement("div");
  b.className = "bubble " + (role === "you" ? "you" : "coach");
  if (role === "you") {
    b.innerHTML = `<div>${text}</div><div class="time mono">${time}</div>`;
  } else {
    b.innerHTML = `<div class="time mono">COACH · ${time}</div><div>${text}</div>`;
  }
  logEl.appendChild(b);
  logEl.scrollTop = logEl.scrollHeight;
}

function nowStr() {
  return new Date().toLocaleTimeString("zh-TW", { hour12: false });
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW";
  u.rate = 1.05;
  window.speechSynthesis.speak(u);
}

async function sendToCoach(text) {
  if (!text) return;
  if (!apiKey) {
    keySetup.style.display = "block";
    return;
  }
  const time = nowStr();
  render("you", text, time);
  history.push({ role: "user", content: text });
  thinkingEl.style.display = "block";
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        max_tokens: 1000,
        messages: [{ role: "system", content: buildSystemPrompt() }, ...history.slice(-10)]
      })
    });
    const data = await res.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message.content)
      || (data.error ? "錯誤：" + data.error.message : "沒有收到回應，再說一次看看");
    history.push({ role: "assistant", content: reply });
    render("coach", reply, nowStr());
    speak(reply);
  } catch (e) {
    render("coach", "連線失敗，再說一次。", nowStr());
  } finally {
    thinkingEl.style.display = "none";
  }
}

// Speech recognition setup
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("micBtn");
const hint = document.getElementById("hint");
const textRow = document.getElementById("textRow");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

if (!SR) {
  micBtn.style.display = "none";
  hint.style.display = "none";
  textRow.style.display = "flex";
} else {
  let listening = false;
  let transcript = "";
  const rec = new SR();
  rec.lang = "zh-TW";
  rec.continuous = false;
  rec.interimResults = true;
  rec.onresult = (e) => {
    transcript = "";
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    hint.textContent = "按一下開始講，再按一下結束";
    if (transcript.trim()) {
      textInput.value = transcript.trim();
      textInput.focus();
    }
    transcript = "";
  };
  rec.onerror = () => {
    listening = false;
    micBtn.classList.remove("listening");
    hint.textContent = "按一下開始講，再按一下結束";
  };
  micBtn.addEventListener("click", () => {
    if (listening) {
      rec.stop();
    } else {
      transcript = "";
      listening = true;
      micBtn.classList.add("listening");
      hint.textContent = "說完再按一次結束";
      try { rec.start(); } catch (e) { listening = false; micBtn.classList.remove("listening"); }
    }
  });
}

sendBtn.addEventListener("click", () => {
  const t = textInput.value.trim();
  textInput.value = "";
  sendToCoach(t);
});
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendBtn.click();
});

// Tabs
const tabCoachBtn = document.getElementById("tabCoachBtn");
const tabRulesBtn = document.getElementById("tabRulesBtn");
const coachPage = document.getElementById("coachPage");
const rulesPage = document.getElementById("rulesPage");
tabCoachBtn.addEventListener("click", () => {
  tabCoachBtn.classList.add("active"); tabRulesBtn.classList.remove("active");
  coachPage.classList.add("active"); rulesPage.classList.remove("active");
});
tabRulesBtn.addEventListener("click", () => {
  tabRulesBtn.classList.add("active"); tabCoachBtn.classList.remove("active");
  rulesPage.classList.add("active"); coachPage.classList.remove("active");
  renderCustomRules();
});

// Custom rules page
const newRuleInput = document.getElementById("newRuleInput");
const saveRuleBtn = document.getElementById("saveRuleBtn");
const customRulesList = document.getElementById("customRulesList");
const rulesEmpty = document.getElementById("rulesEmpty");

function renderCustomRules() {
  const list = loadCustomRules();
  customRulesList.innerHTML = "";
  rulesEmpty.style.display = list.length ? "none" : "block";
  list.slice().reverse().forEach((r) => {
    const div = document.createElement("div");
    div.className = "rule-item";
    div.innerHTML = `<div class="rule-time mono">${r.time}</div><div class="rule-text"></div>`;
    div.querySelector(".rule-text").textContent = r.text;
    const del = document.createElement("button");
    del.className = "rule-del";
    del.textContent = "刪除";
    del.addEventListener("click", () => {
      const cur = loadCustomRules().filter((x) => x.id !== r.id);
      saveCustomRules(cur);
      renderCustomRules();
    });
    div.appendChild(del);
    customRulesList.appendChild(div);
  });
}

saveRuleBtn.addEventListener("click", () => {
  const text = newRuleInput.value.trim();
  if (!text) return;
  const list = loadCustomRules();
  list.push({ id: Date.now(), text, time: new Date().toLocaleString("zh-TW", { hour12: false }) });
  saveCustomRules(list);
  newRuleInput.value = "";
  renderCustomRules();
});

renderCustomRules();
</script>
</body>
</html>
